<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 영상 촬영 계획</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:#213d33;font:15px/1.6 'Malgun Gothic',sans-serif}header{background:#173e33;color:white;padding:28px max(20px,calc((100vw - 1400px)/2))}header small{color:#b7d2c4}h1{margin:4px 0;font-size:28px}main{max-width:1440px;margin:auto;padding:20px}button{font:inherit;border:1px solid #cbd8cf;background:white;color:#244c3c;border-radius:8px;padding:9px 13px;cursor:pointer;display:inline-block}button:hover{background:#edf5ee}.primary{background:#236b50;color:white;border-color:#236b50}.primary:hover{background:#185039}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.bar span{margin-left:auto;font-size:13px}.panel{background:white;border:1px solid #dce5dc;border-radius:14px;padding:18px}.meta{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}label{display:block;font-size:12px;color:#62766b}input,textarea,select{font:inherit;color:#203e32;background:#fff;border:1px solid #d6dfd6;border-radius:7px;padding:9px;width:100%;min-width:0}textarea{resize:vertical;min-height:100px;line-height:1.6}.wide{grid-column:1/-1}.hint{font-size:13px;color:#586f60;background:#e8f2e9;padding:12px 16px;border-radius:9px;margin-top:15px}.head,.scene{display:grid;grid-template-columns:100px 1.4fr 1fr 1fr .85fr;gap:0}.head{background:#244f3e;color:white;border-radius:10px 10px 0 0}.head div{padding:12px}.scene{background:white;border:1px solid #dce5dc;border-top:0}.cell{padding:14px;border-right:1px solid #e1e8df;min-width:0}.cell:last-child{border:0}.scene .cell>label{margin-top:9px}.scene.done{background:#f1f7ef}.scene.done input,.scene.done textarea{background:#f7fbf5}.number{font-size:21px;font-weight:bold}.mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}.mini button{padding:5px 8px;font-size:12px}.check{display:flex;align-items:center;gap:5px;margin-top:8px}.check input{width:18px;height:18px}.scene-title{display:none}.foot{color:#6b7d70;font-size:12px;margin:20px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#153d2f;color:white;border-radius:10px;padding:12px 20px;z-index:9;display:none;max-width:90vw}.status{color:#755425}button:disabled{opacity:.4;cursor:default}@media(max-width:850px){.meta{grid-template-columns:1fr 1fr}.head{display:none}.scene{grid-template-columns:1fr;border:1px solid #dce5dc;border-radius:12px;margin:14px 0;overflow:hidden}.cell{border-right:0;border-bottom:1px solid #e1e8df}.cell:first-child{display:flex;align-items:center;gap:14px;background:#e6efe5;flex-wrap:wrap}.cell:first-child .mini{margin:0;margin-left:auto}.scene-title{display:block;font-weight:bold;margin-bottom:9px}.bar span{width:100%;margin:0}main{padding:12px}header{padding:20px}h1{font-size:24px}}@media print{@page{size:A4 landscape;margin:10mm}body{background:white;font-size:11px}header{background:white;color:#183e30;padding:0}header small,.bar,.hint,.foot,.mini,.toast{display:none!important}main{padding:0}.panel{padding:8px;border:0}.head,.scene{display:grid;grid-template-columns:65px 1.4fr 1fr 1fr .85fr}.head{background:#eee;color:black}.scene{break-inside:avoid}.cell{padding:7px}.scene-title{display:none}input,textarea,select{border:0;padding:0;font-size:11px;background:transparent!important}textarea{resize:none;overflow:hidden;min-height:40px}.check{font-size:10px}.meta{grid-template-columns:2fr 1fr 1fr 1fr}.cell:first-child{display:block;background:white}}
</style></head><body><header><small>VIDEO PLANNING · 나의 촬영 노트</small><h1>촬영 스토리보드</h1><div>장면을 구상하고, 촬영할 내용을 한눈에.</div></header><main><section class="panel"><div class="meta" id="meta"></div></section><div class="hint">내용을 자유롭게 수정한 뒤 <b>HTML 저장</b>을 눌러저장하세요.HTML 저장은 현재 입력 내용을 담은 새 파일로 저장합니다. 기존 파일을 자동으로 덮어쓰지 않습니다. 수정 후에는 새로 저장한 파일을 열어 주세요.</div><div class="bar"><button class="primary" id="save">HTML 저장</button><button id="add">＋ 장면 추가</button><button id="print">인쇄 / PDF</button><span class="status" id="status" role="status"></span></div><div class="head"><div>번호 / 시간</div><div>화면 / 촬영 구성</div><div>Super (자막)</div><div>오디오</div><div>비고</div></div><div id="scenes"></div><div class="bar"><button id="addbottom">＋ 장면 추가</button><span id="summary"></span></div><p class="foot">HTML 저장은 현재 입력 내용을 담은 새 파일로 저장합니다. 기존 파일에 자동으로 덮어쓰지 않습니다</p></main><div id="toast" class="toast" role="status" style="display: none;"></div><script id="data" type="application/json">{"id":"sb-1790930400028-vxa0v1tkd4i","meta":{"title":"나의 영상 촬영 계획","date":"2026-10-03","place":"집","ratio":"세로 9:16","equipment":"ㆍ","purpose":"목적"},"scenes":[{"id":"scene-1","duration":"20","screen":"익스트림 롱샷 (Extreme Long Shot, ELS)\n피사체가 매우 작게 보이며, 주변 배경과 전체적인 환경, 분위기를 보여줄 때 사용합니다. (예: 아득한 풍경, 도시 전경) ","subtitle":"","audio":"첫 인사 / 도입 내레이션2","note":"장소, 준비물, 촬영 구도 메모2","done":false},{"id":"scene-2","duration":"20","screen":"롱샷 (Long Shot, LS): 인물의 전신과 주변 배경이 함께 들어오는 샷입니다. 공간 안에서 인물이 어떤 상황에 있는지 보여줍니다. ","subtitle":"핵심 내용을 짧게 정리","audio":"설명 대본 / 현장 소리","note":"필요한 추가 컷 메모","done":false},{"id":"scene-3","duration":"5","screen":"풀샷 (Full Shot, FS): 인물의 머리 끝부터 발 끝까지 화면에 딱 맞게 채우는 샷입니다. 인물의 전체적인 동작이나 의상, 자세를 전달하는 데 효과적입니다. ","subtitle":"마무리 한 줄","audio":"마무리 멘트 / BGM","note":"","done":false},{"id":"s-1790930463749-v125yqt3t2r","duration":"5","screen":"니샷 (Knee Shot, KS): 무릎 위부터 머리 끝까지 담는 샷입니다. 움직임이 많은 상황이나 2인 이상의 대화 장면에서 자주 쓰입니다. ","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933590079-nsmnpe7d93i","duration":"5","screen":"웨스트샷 (Waist Shot, WS): 허리 위부터 머리 끝까지 담는 가장 안정적인 샷입니다. 뉴스 진행, 대화, 일반적인 상반신 동작을 보여줄 때 가장 기본적으로 활용됩니다. ","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933604418-r4baikjq1ak","duration":"5","screen":"바스트샷 (Bust Shot, BS): 가슴 위부터 머리 끝까지 담는 샷입니다. 인물의 표정과 상반신 미세한 움직임을 잘 나타내어 TV 및 영화 대화 장면에서 매우 흔하게 쓰입니","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933615030-be5edeju9zg","duration":"5","screen":"클로즈업 (Close-Up, CU): 인물의 얼굴 전체나 특정 신체 부위, 물체를 화면에 가득 채우는 샷입니다. 인물의 감정 상태나 특정 디테일을 강조할 때 사용합니다. ","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933626329-ggou4p1buws","duration":"5","screen":"익스트림 클로즈업 (Extreme Close-Up, ECU): 눈, 입술, 특정 사물의 작은 부분 등 매우 좁은 부위를 극도로 확대해 보여줍니다. 긴장감이나 강렬한 주시 효과를 줍니다. ","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933648419-7xf7mrphi7s","duration":"5","screen":"아이 레벨 (Eye-Level / Normal Angle): 인물의 눈높이와 평행하게 촬영하는 앵글입니다. 가장 자연스럽고 중립적인 느낌을 줍니다 ","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933666034-s15blvy4nv","duration":"5","screen":"하이 앵글 (High Angle / 俯角): 피사체를 위에서 아래로 내려다보며 촬영합니다. 피사체를 작고 약하거나 불쌍하게 연출할 때 유용합니다. ","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933678206-bmkv6o75jt","duration":"5","screen":"버드아이 뷰 (Bird's Eye View): 마치 새가 하늘에서 내려다보듯 극단적인 높은 위치에서 perpendicular하게 촬영하는 앵글입니다. 전경이나 배치감을 직관적으로 보여줍니다. ","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933693827-wcxswxqky8","duration":"5","screen":"로우 앵글 (Low Angle / 仰角): 피사체를 아래에서 위로 올려다보며 촬영합니다. 피사체를 웅장하고 권위 있거나 위협적으로 보이게 만듭니다. ","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933707473-bptnz1go6cw","duration":"5","screen":"웜아이 뷰 (Worm's Eye View): 땅바닥에 바짝 붙어 위를 쳐다보듯 촬영하는 극단적인 로우 앵글입니다. ","subtitle":"","audio":"","note":"","done":false},{"id":"s-1790933719112-7vbt1tnzwrt","duration":"5","screen":"더치 앵글 / 틸트 앵글 (Dutch Angle): 카메라는 기울여 촬영하는 기법입니다. 불안정함, 혼란, 기이함, 긴장감을 표현할 때 쓰입니다. ","subtitle":"","audio":"","note":"","done":false}]}</script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let state=JSON.parse($('data').textContent);if(state.id==='storyboard-template')state.id='sb-'+Date.now()+'-'+Math.random().toString(36).slice(2);let dirty=false;
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',3500)}
function change(){dirty=true;$('status').textContent='수정됨 · 마지막에 HTML 저장을 눌러 주세요';summary()}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function button(text,fn,cls){let b=el('button',text,cls);b.type='button';b.onclick=fn;return b}
function field(parent,title,obj,k,multiline=false){let l=el('label',title),n=el(multiline?'textarea':'input');n.value=obj[k]||'';n.setAttribute('aria-label',title);n.oninput=()=>{obj[k]=n.value;change();if(multiline)fit(n)};l.append(n);parent.append(l);return n}function fit(n){n.style.height='auto';n.style.height=Math.max(100,n.scrollHeight+2)+'px'}
const labels={title:'영상 제목',date:'촬영 날짜',place:'촬영 장소',ratio:'영상 비율',equipment:'카메라 · 마이크 · 준비물',purpose:'영상 목적 · 촬영 진행 메모'};for(const k of Object.keys(labels)){const n=field($('meta'),labels[k],state.meta,k,k==='purpose');if(k==='date')n.type='date';if(k==='equipment'||k==='purpose')n.parentNode.className='wide'}
function summary(){const secs=state.scenes.reduce((t,s)=>t+(Number(s.duration)||0),0);$('summary').textContent='총 '+state.scenes.length+'장면 · 예상 '+Math.floor(secs/60)+'분 '+(secs%60)+'초 · 촬영 완료 '+state.scenes.filter(s=>s.done).length+'개'}
function render(){const root=$('scenes');root.replaceChildren();state.scenes.forEach((s,i)=>{const row=el('section',undefined,'scene'+(s.done?' done':''));const cells=Array.from({length:5},()=>el('div',undefined,'cell'));cells.forEach(c=>row.append(c));cells[0].append(el('div','S'+(i+1),'number'));const dur=field(cells[0],'예상 시간 (초)',s,'duration');dur.type='number';dur.min='0';let l=el('label',undefined,'check'),c=el('input');c.type='checkbox';c.checked=s.done;c.onchange=()=>{s.done=c.checked;row.classList.toggle('done',s.done);change()};l.append(c,el('span','촬영 완료'));cells[0].append(l);const ops=el('div',undefined,'mini');function move(d){const j=i+d;if(j<0||j>=state.scenes.length)return;[state.scenes[i],state.scenes[j]]=[state.scenes[j],state.scenes[i]];change();render()}let up=button('↑',()=>move(-1)),down=button('↓',()=>move(1));up.disabled=i===0;down.disabled=i===state.scenes.length-1;up.setAttribute('aria-label','장면 위로');down.setAttribute('aria-label','장면 아래로');ops.append(up,down,button('복제',()=>{state.scenes.splice(i+1,0,{...s,id:uid(),done:false});change();render()}),button('삭제',()=>{if(confirm('이 장면을 삭제할까요?')){state.scenes.splice(i,1);change();render()}}));cells[0].append(ops);
['화면 / 촬영 구성','Super (자막)','오디오','비고'].forEach((t,j)=>cells[j+1].append(el('div',t,'scene-title')));field(cells[1],'구도 · 움직임 · 촬영할 화면',s,'screen',true);field(cells[2],'말자막 · 상황자막 · 요약자막',s,'subtitle',true);field(cells[3],'내레이션 · 대사 · BGM · 효과음',s,'audio',true);field(cells[4],'장소 · 소품 · 촬영 주의사항',s,'note',true);root.append(row)});root.querySelectorAll('textarea').forEach(fit);summary()}
function uid(){return 's-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function add(){state.scenes.push({id:uid(),duration:'5',screen:'',subtitle:'',audio:'',note:'',done:false});change();render();$('scenes').lastElementChild.scrollIntoView({behavior:'smooth',block:'start'})}$('add').onclick=add;$('addbottom').onclick=add;$('print').onclick=()=>window.print();
$('save').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');clone.querySelector('#scenes').replaceChildren();clone.querySelector('#meta').replaceChildren();clone.querySelector('#toast').style.display='none';clone.querySelector('#status').textContent='';clone.querySelector('#summary').textContent='';clone.querySelector('title').textContent=state.meta.title||'촬영 스토리보드';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=(state.meta.title||'촬영_스토리보드').replace(/[\\/:*?"<>|]/g,'_')+'.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);dirty=false;$('status').textContent='HTML 다운로드 요청 완료';toast('수정 내용을 담은 HTML을 다운로드합니다. 새 파일을 열면 저장한 내용이 바로 나옵니다.')};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render();$('status').textContent='준비됨 · 입력 후 HTML 저장';
})();
</script>
</body></html>
